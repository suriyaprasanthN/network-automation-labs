---
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_cli_ssh_type: paramiko
    ansible_user: YouTube123
    ansible_password: "123"
    ansible_ssh_common_args: >
      -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1
      -o HostKeyAlgorithms=+ssh-rsa
      -o Ciphers=+aes128-cbc,aes256-cbc,aes128-ctr,aes256-ctr
  children:
    routers:
      hosts:
        MGMT-SW:
          ansible_host: 192.168.117.10
          ansible_network_os: ios