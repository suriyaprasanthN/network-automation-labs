[defaults]
inventory = ./inventory.yml
host_key_checking = False
display_skipped_hosts = False

[ssh_connection]
ssh_args = -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1,diffie-hellman-group1-sha1 -o Ciphers=+aes128-cbc,aes256-cbc,aes128-ctr,aes256-ctr -o HostKeyAlgorithms=+ssh-rsa

